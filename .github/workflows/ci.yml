name: CI

# Build and typecheck VS Code extensions using the repository's real build scripts.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kp-adhikarana/package-lock.json

      - name: Build and typecheck Adhikarana extension
        run: |
          cd kp-adhikarana
          npm ci
          npm run typecheck
          npm run build
